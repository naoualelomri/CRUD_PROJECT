<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>espace client</title>
    <style>
        body{
            background-image: url("Home/background.png") ;
            background-repeat: no-repeat; 
             background-size: cover; 
            background-position: center; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            
        }
        h1 {
          text-align: center;
         color: #73eb77;
          margin-top: 20px;}
          form {
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
    
    border-radius: 8px;
    
    max-width: 500px;
    
   
    background-color: rgba(255, 255, 255, 0.3); /* Fond semi-transparent */
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

/* Styles pour les labels */
label {
    font-weight: bold;
    margin-bottom: 5px;
    display: block;
}

/* Styles pour les champs de saisie */
input[type="text"],
input[type="email"],
input[type="tel"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 5px;
    box-sizing: border-box;
}

/* Styles pour le bouton */
button {
    background-color: #4CAF50;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    width: 100%;
    cursor: pointer;
    font-size: 16px;
}

/* Changer la couleur du bouton au survol */
button:hover {
    background-color: #45a049;
}

/* Ajouter un style aux champs obligatoires */
input[required] {
    background-color: #f9f9f9;
}

/* Espacement général entre les éléments */
br {
    margin-bottom: 10px;
}

    </style>
</head>
<body>
    <h1>Formulaire d'inscription</h1>

    <form id="client">
        <label for="username">Nom d'utilisateur :</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="adresse">Adresse :</label>
        <input type="text" id="adresse" name="adresse" required><br><br>

        <label for="num_tel">Numéro de téléphone :</label>
        <input type="tel" id="num_tel" name="num_tel" required><br><br>

        <button type="submit">Soumettre</button>
    </form>
    <script > 
    const apiUrl = 'http://localhost:3000';
    document.getElementById("client").addEventListener('submit', async (e) => {
        e.preventDefault();
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const adresse = document.getElementById('adresse').value;
                const num_tel = document.getElementById('num_tel').value;
        try {
            const response = await fetch(`${apiUrl}/clients`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, email , adresse , num_tel }),
            });
            if (response.ok) {
                alert('client  ajouté avec succès');
            } else {
                const errorData = await response.json();
                alert("erreur :" + errorData.error);
            }
        } catch (error) {
            console.error('Erreur :', error);
            alert("impossible de se connecter au serveur !")
        }
    });
    </script>
</body>

</html>
